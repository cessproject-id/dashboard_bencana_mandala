<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Edit Tabel Korban Terdampak</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 600px; background: #132247; border: 2px solid #3a506b; border-radius: 12px; padding: 25px; box-shadow: 0 0 20px rgba(0, 150, 255, 0.2); }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; font-weight: 600; color: #cbd5e1; }
        input { padding: 10px 15px; font-size: 1rem; border-radius: 8px; border: 1px solid #3a506b; background: #0b132b; color: #ffffff; font-weight: 700; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn-save { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .btn-save:hover { background: #15803d; }
        .alert-success { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #4ade80; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; display: none; font-weight: 600; }
        .section-title { font-size: 1rem; color: #fbbf24; margin: 15px 0 10px 0; border-bottom: 1px solid #3a506b; padding-bottom: 5px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>PANEL ADMIN TABEL DATA</h1>
        <div id="alert" class="alert-success">Data tabel berhasil diperbarui!</div>

        <form id="admin-form">
            <div class="section-title">1. Kepala Keluarga (KK)</div>
            <div class="form-group">
                <label>Jumlah</label>
                <input type="text" id="input-kk" required>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="input-ket-kk" required>
            </div>

            <div class="section-title">2. Jiwa</div>
            <div class="form-group">
                <label>Jumlah</label>
                <input type="text" id="input-jiwa" required>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="input-ket-jiwa" required>
            </div>

            <div class="section-title">3. Pengungsi di luar tenda</div>
            <div class="form-group">
                <label>Jumlah</label>
                <input type="text" id="input-pengungsi" required>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="input-ket-pengungsi" required>
            </div>

            <div class="section-title">4. Titik tenda pengungsian</div>
            <div class="form-group">
                <label>Jumlah</label>
                <input type="text" id="input-tenda" required>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="input-ket-tenda" required>
            </div>

            <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> SIMPAN & UPDATE REALTIME</button>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('bencana_table_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('input-kk').value = data.kk ?? '399 KK';
                document.getElementById('input-ket-kk').value = data.ketKk ?? 'Data korban terdampak';
                document.getElementById('input-jiwa').value = data.jiwa ?? '2.169 jiwa';
                document.getElementById('input-ket-jiwa').value = data.ketJiwa ?? 'Data korban terdampak';
                document.getElementById('input-pengungsi').value = data.pengungsi ?? '796 jiwa';
                document.getElementById('input-ket-pengungsi').value = data.ketPengungsi ?? 'Tidak teridentifikasi';
                document.getElementById('input-tenda').value = data.tenda ?? '21 titik';
                document.getElementById('input-ket-tenda').value = data.ketTenda ?? 'Ditempati korban';
            } else {
                document.getElementById('input-kk').value = '399 KK';
                document.getElementById('input-ket-kk').value = 'Data korban terdampak';
                document.getElementById('input-jiwa').value = '2.169 jiwa';
                document.getElementById('input-ket-jiwa').value = 'Data korban terdampak';
                document.getElementById('input-pengungsi').value = '796 jiwa';
                document.getElementById('input-ket-pengungsi').value = 'Tidak teridentifikasi';
                document.getElementById('input-tenda').value = '21 titik';
                document.getElementById('input-ket-tenda').value = 'Ditempati korban';
            }
        });

        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const newData = {
                kk: document.getElementById('input-kk').value,
                ketKk: document.getElementById('input-ket-kk').value,
                jiwa: document.getElementById('input-jiwa').value,
                ketJiwa: document.getElementById('input-ket-jiwa').value,
                pengungsi: document.getElementById('input-pengungsi').value,
                ketPengungsi: document.getElementById('input-ket-pengungsi').value,
                tenda: document.getElementById('input-tenda').value,
                ketTenda: document.getElementById('input-ket-tenda').value
            };

            localStorage.setItem('bencana_table_data', JSON.stringify(newData));

            const alertBox = document.getElementById('alert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        });
    </script>
</body>
</html>
