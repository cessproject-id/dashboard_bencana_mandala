<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Update Status Bencana</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: #132247;
            border: 2px solid #3a506b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            padding: 10px 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #3a506b;
            background: #0b132b;
            color: #ffffff;
            font-weight: 700;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.4);
            transition: 0.2s;
        }

        .btn-save:hover {
            background: #15803d;
        }

        .alert-success {
            background: rgba(22, 163, 74, 0.2);
            border: 1px solid #16a34a;
            color: #4ade80;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.1rem;
            color: #f87171;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #3a506b;
            padding-bottom: 5px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>PANEL KONTROL ADMIN</h1>
        <div id="alert" class="alert-success">Data berhasil diperbarui ke proyektor!</div>

        <form id="admin-form">
            <div class="section-title">Data Infrastruktur / Tempat</div>
            <div class="form-group">
                <label>Rumah Terdampak</label>
                <input type="number" id="input-rumah" required>
            </div>
            <div class="form-group">
                <label>Tempat Usaha</label>
                <input type="number" id="input-usaha" required>
            </div>
            <div class="form-group">
                <label>Perahu</label>
                <input type="number" id="input-perahu" required>
            </div>
            <div class="form-group">
                <label>Kapal</label>
                <input type="number" id="input-kapal" required>
            </div>
            <div class="form-group">
                <label>Tempat Ibadah</label>
                <input type="number" id="input-ibadah" required>
            </div>

            <div class="section-title">Data Korban Terdampak & Kondisi</div>
            <div class="form-group">
                <label>Total Korban Terdampak</label>
                <input type="number" id="input-korban-total" required>
            </div>
            <div class="form-group">
                <label>Korban Jiwa</label>
                <input type="number" id="input-jiwa" required>
            </div>
            <div class="form-group">
                <label>Luka Ringan</label>
                <input type="number" id="input-luka-ringan" required>
            </div>
            <div class="form-group">
                <label>Luka Berat</label>
                <input type="number" id="input-luka-berat" required>
            </div>
            <div class="form-group">
                <label>Sakit Ringan</label>
                <input type="number" id="input-sakit-ringan" required>
            </div>
            <div class="form-group">
                <label>Sakit Berat</label>
                <input type="number" id="input-sakit-berat" required>
            </div>

            <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> SIMPAN & UPDATE REALTIME</button>
        </form>
    </div>

    <script>
        // Ambil data saat halaman admin dibuka
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('bencana_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('input-rumah').value = data.rumah ?? 272;
                document.getElementById('input-usaha').value = data.usaha ?? 0;
                document.getElementById('input-perahu').value = data.perahu ?? 24;
                document.getElementById('input-kapal').value = data.kapal ?? 0;
                document.getElementById('input-ibadah').value = data.ibadah ?? 1;
                document.getElementById('input-korban-total').value = data.korbanTotal ?? 1245;
                document.getElementById('input-jiwa').value = data.jiwa ?? 0;
                document.getElementById('input-luka-ringan').value = data.lukaRingan ?? 0;
                document.getElementById('input-luka-berat').value = data.lukaBerat ?? 0;
                document.getElementById('input-sakit-ringan').value = data.sakitRingan ?? 32;
                document.getElementById('input-sakit-berat').value = data.sakitBerat ?? 1;
            } else {
                // Nilai default awal
                document.getElementById('input-rumah').value = 272;
                document.getElementById('input-usaha').value = 0;
                document.getElementById('input-perahu').value = 24;
                document.getElementById('input-kapal').value = 0;
                document.getElementById('input-ibadah').value = 1;
                document.getElementById('input-korban-total').value = 1245;
                document.getElementById('input-jiwa').value = 0;
                document.getElementById('input-luka-ringan').value = 0;
                document.getElementById('input-luka-berat').value = 0;
                document.getElementById('input-sakit-ringan').value = 32;
                document.getElementById('input-sakit-berat').value = 1;
            }
        });

        // Simpan data ke localStorage saat tombol submit diklik
        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const newData = {
                rumah: document.getElementById('input-rumah').value,
                usaha: document.getElementById('input-usaha').value,
                perahu: document.getElementById('input-perahu').value,
                kapal: document.getElementById('input-kapal').value,
                ibadah: document.getElementById('input-ibadah').value,
                korbanTotal: document.getElementById('input-korban-total').value,
                jiwa: document.getElementById('input-jiwa').value,
                lukaRingan: document.getElementById('input-luka-ringan').value,
                lukaBerat: document.getElementById('input-luka-berat').value,
                sakitRingan: document.getElementById('input-sakit-ringan').value,
                sakitBerat: document.getElementById('input-sakit-berat').value
            };

            localStorage.setItem('bencana_data', JSON.stringify(newData));

            // Tampilkan notifikasi sukses
            const alertBox = document.getElementById('alert');
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
