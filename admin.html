<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Dashboard Bencana</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 600px; background: #132247; border: 2px solid #3a506b; border-radius: 12px; padding: 25px; box-shadow: 0 0 20px rgba(0, 150, 255, 0.2); }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; font-weight: 600; color: #cbd5e1; }
        input { padding: 10px 15px; font-size: 1rem; border-radius: 8px; border: 1px solid #3a506b; background: #0b132b; color: #ffffff; font-weight: 700; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn-save { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .btn-save:hover { background: #15803d; }
        .alert-success { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #4ade80; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; display: none; font-weight: 600; }
        .section-title { font-size: 1rem; color: #fbbf24; margin: 15px 0 8px 0; border-bottom: 1px solid #3a506b; padding-bottom: 5px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>PANEL ADMIN DASHBOARD</h1>
        <div id="alert" class="alert-success">Data berhasil diperbarui ke proyektor!</div>
        <form id="admin-form">
            <div class="section-title">Data Terdampak (Panel Kiri Atas)</div>
            <div class="form-group"><label>KK Terdampak</label><input type="text" id="input-kk" required></div>
            <div class="form-group"><label>Jiwa Terdampak</label><input type="text" id="input-jiwa" required></div>
            <div class="form-group"><label>Titik Pengungsian</label><input type="text" id="input-tenda" required></div>

            <div class="section-title">Data Pengungsi (Panel Kanan Atas)</div>
            <div class="form-group"><label>Total Pengungsi</label><input type="text" id="input-total-pengungsi" required></div>
            <div class="form-group"><label>Pengungsi Tertampung</label><input type="text" id="input-tertampung" required></div>
            <div class="form-group"><label>Pengungsi Diluar Tenda</label><input type="text" id="input-belum-tertampung" required></div>

            <div class="section-title">Data Kelompok Rentan (Panel Bawah)</div>
            <div class="form-group"><label>Dewasa</label><input type="number" id="input-dewasa" required></div>
            <div class="form-group"><label>Anak-Anak</label><input type="number" id="input-anak" required></div>
            <div class="form-group"><label>Balita</label><input type="number" id="input-balita" required></div>
            <div class="form-group"><label>Bayi</label><input type="number" id="input-bayi" required></div>
            <div class="form-group"><label>Lansia</label><input type="number" id="input-lansia" required></div>
            <div class="form-group"><label>Ibu Hamil</label><input type="number" id="input-hamil" required></div>
            <div class="form-group"><label>Disabilitas</label><input type="number" id="input-disabilitas" required></div>

            <div class="section-title">Informasi Header & Lokasi</div>
            <div class="form-group"><label>Waktu Update (Contoh: 18:00 WIT)</label><input type="text" id="input-time" required></div>
            <div class="form-group"><label>Lokasi Posko</label><input type="text" id="input-location" required></div>

            <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> SIMPAN & UPDATE REALTIME</button>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('bencana_image_layout_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('input-kk').value = data.kk ?? '399';
                document.getElementById('input-jiwa').value = data.jiwa ?? '2.169';
                document.getElementById('input-tenda').value = data.tenda ?? '21';
                document.getElementById('input-total-pengungsi').value = data.totalPengungsi ?? '2.169';
                document.getElementById('input-tertampung').value = data.tertampung ?? '1.373';
                document.getElementById('input-belum-tertampung').value = data.belumTertampung ?? '796';
                document.getElementById('input-dewasa').value = data.dewasa ?? '525';
                document.getElementById('input-anak').value = data.anak ?? '116';
                document.getElementById('input-balita').value = data.balita ?? '53';
                document.getElementById('input-bayi').value = data.bayi ?? '29';
                document.getElementById('input-lansia').value = data.lansia ?? '25';
                document.getElementById('input-hamil').value = data.hamil ?? '9';
                document.getElementById('input-disabilitas').value = data.disabilitas ?? '5';
                document.getElementById('input-time').value = data.time ?? '18:00 WIT';
                document.getElementById('input-location').value = data.location ?? 'Kelurahan Mandala, Kota Jayapura';
            } else {
                document.getElementById('input-kk').value = '399';
                document.getElementById('input-jiwa').value = '2.169';
                document.getElementById('input-tenda').value = '21';
                document.getElementById('input-total-pengungsi').value = '2.169';
                document.getElementById('input-tertampung').value = '1.373';
                document.getElementById('input-belum-tertampung').value = '796';
                document.getElementById('input-dewasa').value = '525';
                document.getElementById('input-anak').value = '116';
                document.getElementById('input-balita').value = '53';
                document.getElementById('input-bayi').value = '29';
                document.getElementById('input-lansia').value = '25';
                document.getElementById('input-hamil').value = '9';
                document.getElementById('input-disabilitas').value = '5';
                document.getElementById('input-time').value = '18:00 WIT';
                document.getElementById('input-location').value = 'Kelurahan Mandala, Kota Jayapura';
            }
        });

        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const newData = {
                kk: document.getElementById('input-kk').value,
                jiwa: document.getElementById('input-jiwa').value,
                tenda: document.getElementById('input-tenda').value,
                totalPengungsi: document.getElementById('input-total-pengungsi').value,
                tertampung: document.getElementById('input-tertampung').value,
                belumTertampung: document.getElementById('input-belum-tertampung').value,
                dewasa: document.getElementById('input-dewasa').value,
                anak: document.getElementById('input-anak').value,
                balita: document.getElementById('input-balita').value,
                bayi: document.getElementById('input-bayi').value,
                lansia: document.getElementById('input-lansia').value,
                hamil: document.getElementById('input-hamil').value,
                disabilitas: document.getElementById('input-disabilitas').value,
                time: document.getElementById('input-time').value,
                location: document.getElementById('input-location').value
            };

            localStorage.setItem('bencana_image_layout_data', JSON.stringify(newData));

            const alertBox = document.getElementById('alert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        });
    </script>
</body>
</html>
